{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Continue with Google | SmartAI Studio</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            background: #081120;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            position: relative;
        }


        .background-circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(140px);

            z-index: 0;
        }

        .one {

            width: 350px;

            height: 350px;

            background: #0ea5ff;

            top: -100px;

            left: -100px;
        }

        .two {

            width: 450px;

            height: 450px;

            background: #1d4ed8;

            right: -150px;

            bottom: -150px;
        }



        .google-card {

            position: relative;

            z-index: 2;

            width: 430px;

            padding: 45px 40px;

            background: rgba(255,255,255,.07);

            border: 1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(18px);

            border-radius: 20px;

            box-shadow:
                0 25px 50px rgba(0,0,0,.35);

            text-align: center;
        }



        .logo-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: rgba(0,191,255,.12);

            border: 1px solid rgba(0,191,255,.25);
        }

        .logo-icon i {

            font-size: 38px;

            color: #00BFFF;
        }



        h1 {

            font-size: 28px;

            margin-bottom: 12px;
        }

        .subtitle {

            color: #b8c3d1;

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        .google-info {

            background: rgba(255,255,255,.05);

            border: 1px solid rgba(255,255,255,.10);

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 25px;

            display: flex;

            align-items: center;

            gap: 12px;

            text-align: left;
        }

        .google-info i {

            color: #db4437;

            font-size: 22px;
        }

        .google-info span {

            color: #d4dce7;

            font-size: 14px;
        }


        .continue-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 12px;

            background: #00BFFF;

            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        .continue-btn:hover {

            transform: translateY(-3px);

            background: #0ea5ff;

            box-shadow:
                0 15px 35px rgba(0,191,255,.35);
        }


        .cancel-btn {

            display: block;

            margin-top: 18px;

            color: #b8c3d1;

            text-decoration: none;

            font-size: 14px;
        }

        .cancel-btn:hover {

            color: #00BFFF;
        }


        .security {

            margin-top: 25px;

            color: #718096;

            font-size: 12px;

            line-height: 1.6;
        }


        @media(max-width:500px) {

            .google-card {

                width: calc(100% - 30px);

                padding: 35px 25px;
            }

            h1 {

                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <div class="background-circle one"></div>
    <div class="background-circle two"></div>


    <div class="google-card">


        <div class="logo-icon">

            <i class="fa-solid fa-robot"></i>

        </div>


        <h1>
            Continue with Google
        </h1>


        <p class="subtitle">

            You're about to sign in to
            <strong>SmartAI Studio</strong>
            using your Google account.

        </p>


        <div class="google-info">

            <i class="fa-brands fa-google"></i>

            <span>
                Secure authentication powered by Google
            </span>

        </div>


        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="continue-btn"
            >

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>

        </form>


        <a
            href="{% url 'login' %}"
            class="cancel-btn"
        >

            ← Back to Login

        </a>


        <p class="security">

            <i class="fa-solid fa-shield-halved"></i>

            Your Google password is never shared with SmartAI Studio.

        </p>

    </div>

</body>

</html>
